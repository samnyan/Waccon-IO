<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Waccon Controller</title>
    <link rel="stylesheet" href="./controller.css">
</head>
<body>
    <canvas id="canvas">Upgrade your browser!</canvas>
    <div id="io-buttons" aria-label="IO buttons" hidden>
        <div class="io-button-group">
            <button type="button" data-io-button="volumeUp">VOL+</button>
            <button type="button" data-io-button="volumeDown">VOL-</button>
        </div>
        <div class="io-button-group">
            <button type="button" data-io-button="test">TEST</button>
            <button type="button" data-io-button="service">SERVICE</button>
            <button type="button" data-io-button="coin">COIN</button>
        </div>
    </div>
    <div id="status-panel">
        <output id="status" aria-live="polite">Connecting…</output>
        <button id="settings-button" type="button" aria-haspopup="dialog" aria-expanded="false">Settings</button>
    </div>
    <section id="settings-dialog" role="dialog" aria-labelledby="settings-title" aria-hidden="true">
        <h2 id="settings-title">Settings</h2>
        <label>
            <input id="led-brightness-amplifier" type="checkbox">
            LED brightness amplifier
        </label>
        <label>
            <input id="show-io-buttons" type="checkbox">
            Show IO Buttons
        </label>
        <div class="settings-actions">
            <button id="settings-save" type="button">Save</button>
        </div>
    </section>
    <script type="module" src="./controller.js"></script>
</body>
</html>
